# Dependent services shared by every framework: Postgres (test 4), the fast
# Rust (axum) static-JSON `upstream` (test 3), and the load-generating `runner`. Combine
# with exactly one compose.<framework>.yml to bench that framework alone:
#
#   RUN_ID=20260813T120000 docker compose \
#     -f compose.base.yml -f compose.jero.yml \
#     up --build --abort-on-container-exit --exit-code-from runner
#
# `task bench` (bench.py) drives this one framework at a time for every name
# in $FRAMEWORKS, sharing one RUN_ID (the kickoff timestamp) across the whole
# invocation so every framework's results land under the same run in
# TaglyDB. Frameworks never run concurrently, so every one gets an
# identical, contention-free environment — see README "Fairness".

x-mem: &mem
  resources:
    limits:
      memory: 2G

services:
  postgres:
    image: postgres:18-alpine
    deploy: *mem
    cpuset: "1,2"
    # Only one framework's pool (64 connections) is ever live at a time;
    # max_connections=200 leaves plenty of headroom above that.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
      POSTGRES_DB: bench
    volumes:
      - ./services/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 2s
    networks: [bench]

  upstream:
    build: { context: ./services/upstream }
    deploy: *mem
    cpuset: "3,4"
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
    environment:
      UPSTREAM_API_KEY: "upk_bench_9f8e7d6c5b4a32100fedcba987654321"
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget prefers IPv6 ::1 but axum binds IPv4.
      test: ["CMD", "/bin/busybox", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 2s
    networks: [bench]

  # Each compose.<fw>.yml adds its own `depends_on` entry (itself) and sets
  # FRAMEWORK — both dict-typed fields, so they merge with what's defined
  # here rather than replacing it.
  runner:
    # Context is the repo root, not ./loadtest -- the runner's taglydb
    # dependency is vendored at ./vendor and pulled in via a uv path source
    # relative to loadtest/pyproject.toml (see loadtest/Dockerfile).
    build: { context: ., dockerfile: loadtest/Dockerfile }
    deploy: *mem
    cpuset: "5,6"
    depends_on:
      upstream: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      RUN_ID: ${RUN_ID}
      RUN_CREATED_AT: ${RUN_CREATED_AT}
      JWT_SECRET: "b7c1e9a4f2d68350a1c9e7b5d3f10864a2c6e8b0d4f79351"
      DURATION: ${DURATION:-10s}
      VUS: ${VUS:-100}
      RUNS: ${RUNS:-3}
      WORKERS: ${WORKERS:-1}
      LOADGEN: ${LOADGEN:-wrk}
      TESTS: ${TESTS:-test1 test2 test3 test4}
      BENCH_HOSTNAME: ${BENCH_HOSTNAME:-}
      # Informational only (not needed to run a bench) -- set by ec2_launch.py
      # so a report generated from this run can say exactly what it ran on.
      EC2_AMI_ID: ${EC2_AMI_ID:-}
      EC2_INSTANCE_TYPE: ${EC2_INSTANCE_TYPE:-}
      AWS_REGION: ${AWS_REGION:-}
      IMAGES: ${IMAGES:-}
      COMMIT: ${COMMIT:-}
      # Results backend: TaglyDB. bench.py reads this from .env and
      # forwards it here — see loadtest/run.py's Tagly.build() call
      # (base URL is inlined there, not env-configurable).
      TAGLYDB_API_KEY: ${TAGLYDB_API_KEY:-}
    volumes:
      # Read-only docker socket so the runner can `docker stats` the
      # framework's own container (cgroup CPU/mem) during each attempt.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [bench]

networks:
  bench:
    driver: bridge
