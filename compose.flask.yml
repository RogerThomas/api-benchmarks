# Flask — combine with compose.base.yml (see that file for the full command).
# `task bench` drives this automatically for every name in $FRAMEWORKS.

services:
  flask:
    build: { context: ./services/python, target: flask }
    deploy:
      resources:
        limits:
          memory: 2G
    cpuset: "0"
    # Flask is sync (peregrine WSGI). Views run inline on the worker, no
    # --wsgi-threads pool: a thread sweep (1/2/4/8, under granian) showed 1
    # wins on every test including the I/O ones — on a single capped core the
    # GIL + scheduling overhead swamp any I/O-overlap gain.
    environment:
      WORKERS: ${WORKERS:-1}
    depends_on:
      upstream: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/info')"]
      # Probe every 1s until healthy, then only hourly: a probe mid-bench would
      # run on the measured core (and costs more for some images than others).
      start_period: 120s
      start_interval: 1s
      interval: 1h
      timeout: 3s
    networks: [bench]

  runner:
    depends_on:
      flask: { condition: service_healthy }
    environment:
      FRAMEWORK: flask
