# Build, push, bench, report: builds every image the run needs whose source
# isn't in ECR yet (natively, on an arm64 runner), pushes it, starts the spot
# instance(s), waits for them to finish (each self-terminates after its bench),
# then writes the report -- results, time and spot cost -- to the job summary,
# and the report files (with the chart) as an artifact.
#
# Images are matched by source, not rebuilt per run (see ec2_launch.py): with
# no `tag`, a commit that didn't touch a service reuses its image, so building
# is always right -- the images always match the commit benched.
#
# AWS access is the jero-api-benchmarks-ci role, assumed via OIDC (only from
# main) -- no AWS keys anywhere. The role and the AWS_ROLE_ARN / AWS_REGION repo
# variables are managed in ~/workspace/init (iac/live/projects/jero-api-benchmarks).
# TAGLYDB_API_KEY is a repo secret: gh secret set TAGLYDB_API_KEY
#
#     gh workflow run launch-ec2                                  # everything
#     gh workflow run launch-ec2 -f frameworks=jero -f tests="test1 test4"

name: launch-ec2

on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: Space-separated frameworks (empty = all)
        type: string
        default: ""
      tests:
        description: Space-separated tests, e.g. "test1 test4" (empty = all)
        type: string
        default: ""
      duration:
        description: Per attempt
        type: string
        default: 60s
      vus:
        description: Concurrent connections
        type: number
        default: 128
      runs:
        description: Attempts per test (best wins)
        type: number
        default: 3
      loadgen:
        type: choice
        options: [wrk, oha]
        default: wrk
      parallel:
        description: One instance per framework (off = all on one, sequentially)
        type: boolean
        default: true
      tag:
        description: Run this exact framework image version, e.g. 2026.10.25.01 (skips the build)
        type: string
        default: ""
      run_id:
        description: Add to an existing run (backfill) instead of starting a new one
        type: string
        default: ""

permissions:
  id-token: write # OIDC token for the AWS role
  contents: read

# Two runs building at once could pick the same next CalVer version of an image.
concurrency:
  group: launch-ec2
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  launch:
    runs-on: ubuntu-24.04-arm # same arch as the c9g instances: native builds
    # A first build of every image is ~15 min, a full parallel bench ~15 min.
    timeout-minutes: 90
    # Inputs go through env, never straight into a script (injection).
    env:
      TAGLYDB_API_KEY: ${{ secrets.TAGLYDB_API_KEY }}
      FRAMEWORKS: ${{ inputs.frameworks }}
      TAG: ${{ inputs.tag }}
    steps:
      - run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # ec2_launch.py checks HEAD is on a pushed branch

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: astral-sh/setup-uv@v10.3.2 # no floating major tags since v8

      - name: Build and push images
        id: build
        if: inputs.tag == ''
        run: |
          uv run --no-dev yeet ./ec2_launch.py:push --frameworks "$FRAMEWORKS"
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Launch
        id: launch
        env:
          TESTS: ${{ inputs.tests }}
          DURATION: ${{ inputs.duration }}
          VUS: ${{ inputs.vus }}
          RUNS: ${{ inputs.runs }}
          LOADGEN: ${{ inputs.loadgen }}
          PARALLEL: ${{ inputs.parallel }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          run_id=${RUN_ID:-$(date -u +%Y%m%dT%H%M%S)}
          args=(--frameworks "$FRAMEWORKS" --tests "$TESTS" --duration "$DURATION"
                --vus "$VUS" --runs "$RUNS" --loadgen "$LOADGEN" --run-id "$run_id"
                --tag "$TAG")
          if [ "$PARALLEL" = true ]; then args+=(--parallel); fi
          # The log goes outside the checkout: ec2_launch.py refuses a dirty tree.
          # On a partial launch, still hand the launched instances on (and fail after).
          status=0
          uv run --no-dev yeet ./ec2_launch.py "${args[@]}" | tee "$RUNNER_TEMP/launch.log" || status=$?
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "instances=$(grep -o 'launched i-[0-9a-f]*' "$RUNNER_TEMP/launch.log" | cut -d' ' -f2 | xargs)" >> "$GITHUB_OUTPUT"
          exit $status

      # Fresh credentials: the role's sessions last an hour, a build plus a bench can come close.
      - uses: aws-actions/configure-aws-credentials@v6
        if: always() && steps.launch.outputs.instances != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Wait for the bench
        if: always() && steps.launch.outputs.instances != ''
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
          INSTANCES: ${{ steps.launch.outputs.instances }}
          BUILD_SECONDS: ${{ steps.build.outputs.seconds || 0 }}
        run: |
          uv run --no-dev yeet ./ec2_launch.py:wait --run-id "$RUN_ID" --instances "$INSTANCES" \
            --build-seconds "$BUILD_SECONDS" --job-started "$JOB_STARTED" > "$RUNNER_TEMP/time-and-cost.md"

      - name: Report
        if: always() && steps.launch.outputs.instances != ''
        env:
          RUN_ID: ${{ steps.launch.outputs.run_id }}
        run: |
          uv run --no-dev yeet ./export_results.py "$RUN_ID"
          report="reports/$RUN_ID/report.md"
          {
            head -n 1 "$report"
            echo
            cat "$RUNNER_TEMP/time-and-cost.md" 2>/dev/null || true
            echo
            # The chart is an SVG file next to the report: in the artifact, not inline.
            tail -n +2 "$report" | grep -v '^!\['
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always() && steps.launch.outputs.instances != ''
        with:
          name: report-${{ steps.launch.outputs.run_id }}
          path: reports/${{ steps.launch.outputs.run_id }}/
          if-no-files-found: ignore
