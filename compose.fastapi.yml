# FastAPI — combine with compose.base.yml (see that file for the full command).
# `task bench` drives this automatically for every name in $FRAMEWORKS.

services:
  fastapi:
    build: { context: ./services/python, target: fastapi }
    deploy:
      resources:
        limits:
          memory: 2G
    cpuset: "0"
    environment:
      JWT_SECRET: "b7c1e9a4f2d68350a1c9e7b5d3f10864a2c6e8b0d4f79351"
      WORKERS: ${WORKERS:-1}
      UPSTREAM_URL: http://upstream:8000
      UPSTREAM_API_KEY: "upk_bench_9f8e7d6c5b4a32100fedcba987654321"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: bench
      DB_USER: bench
      DB_PASSWORD: bench
    depends_on:
      upstream: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/info')"]
      # Probe every 1s until healthy, then only hourly: a probe mid-bench would
      # run on the measured core (and costs more for some images than others).
      start_period: 120s
      start_interval: 1s
      interval: 1h
      timeout: 3s
    networks: [bench]

  runner:
    depends_on:
      fastapi: { condition: service_healthy }
    environment:
      FRAMEWORK: fastapi
