# Robyn — combine with compose.base.yml (see that file for the full command).
# `task bench` drives this automatically for every name in $FRAMEWORKS.

services:
  robyn:
    build: { context: ./services/python, target: robyn }
    deploy:
      resources:
        limits:
          memory: 2G
    cpuset: "0"
    environment:
      WORKERS: ${WORKERS:-1}
    depends_on:
      upstream: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/info')"]
      # Probe every 1s until healthy, then only hourly: a probe mid-bench would
      # run on the measured core (and costs more for some images than others).
      start_period: 120s
      start_interval: 1s
      interval: 1h
      timeout: 3s
    networks: [bench]

  runner:
    depends_on:
      robyn: { condition: service_healthy }
    environment:
      FRAMEWORK: robyn
