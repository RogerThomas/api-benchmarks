[project]
name = "jero-benchmarks-python"
version = "0.0.0"
description = "Python API-framework benchmark targets. One uv dependency group per framework."
requires-python = ">=3.14.3"
dependencies = []

[tool.uv]
# Not a package — just a home for per-framework dependency groups installed into
# isolated venvs (one per Dockerfile stage).
package = false

[tool.uv.sources]
# robyn publishes no cp314 wheels (and no sdist), so build its release tag from source.
robyn = { url = "https://github.com/sparckles/Robyn/archive/refs/tags/v0.88.0.tar.gz" }

# One group per framework. Each Dockerfile stage syncs ONLY its own group
# (`uv sync --no-default-groups --group <fw>`) so deps never interfere.
[dependency-groups]
jero = [
    "peregrine-server[uvloop]",
    "ryjwt[msgspec]",
    "lothc[msgspec]",
    "fastpg",
    "jero>=0.0.27",
]
fastapi = [
    # A/B: the versions before the 2026-10-25 upgrade.
    "fastapi==0.161.1",
    "starlette==1.9.0",
    "peregrine-server[uvloop]",
    "ryjwt",
    "lothc[pydantic]",
    "fastpg[pydantic]",
    "pydantic",
]
litestar = [
    "litestar",
    "peregrine-server[uvloop]",
    "ryjwt",
    "lothc[msgspec]",
    "fastpg",
]
flask = [
    "flask",
    "peregrine-server",
    "ryjwt",
    "lothc[pydantic]",
    "psycopg[binary,pool]",
    "pydantic",
]
blacksheep = [
    "blacksheep",
    "peregrine-server[uvloop]",
    "ryjwt",
    "lothc[pydantic]",
    "fastpg[pydantic]",
    "pydantic",
]
robyn = ["robyn", "ryjwt", "lothc[pydantic]", "fastpg[pydantic]", "pydantic"]
django-bolt = [
    "django>=5.2",
    "django-bolt",
    "msgspec",
    "ryjwt",
    "lothc",
    "fastpg",
]
