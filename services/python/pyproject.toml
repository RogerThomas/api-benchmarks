[project]
name = "jero-benchmarks-python"
version = "0.0.0"
description = "Python API-framework benchmark targets. One uv dependency group per framework."
requires-python = ">=3.14.3"
dependencies = []

[tool.uv]
# Not a package — just a home for per-framework dependency groups installed into
# isolated venvs (one per Dockerfile stage).
package = false
# The groups never share a venv (see below), so tell uv they're mutually
# exclusive: each then resolves on its own, and one framework's caps can't hold
# back the rest (robyn 0.88.0 pins uvloop<0.23, which would otherwise keep every
# peregrine[uvloop] app on the old uvloop too).
conflicts = [
    [
        { group = "jero" },
        { group = "fastapi" },
        { group = "litestar" },
        { group = "flask" },
        { group = "blacksheep" },
        { group = "robyn" },
        { group = "django-bolt" },
    ],
]

[tool.uv.sources]
# robyn publishes no cp314 wheels (and no sdist), so build its release tag from source.
robyn = { url = "https://github.com/sparckles/Robyn/archive/refs/tags/v0.88.0.tar.gz" }

# One group per framework. Each Dockerfile stage syncs ONLY its own group
# (`uv sync --no-default-groups --group <fw>`) so deps never interfere.
[dependency-groups]
jero = [
    "peregrine-server[uvloop]",
    "uvloop>=0.23.0",
    "ryjwt[msgspec]>=0.3.1",
    "lothc[msgspec]>=0.3.0",
    "fastpg>=0.2.2",
    "jero>=0.4.0",
]
fastapi = [
    "fastapi",
    "peregrine-server[uvloop]",
    "uvloop>=0.23.0",
    "ryjwt>=0.3.1",
    "lothc[pydantic]>=0.3.0",
    "fastpg[pydantic]>=0.2.2",
    "pydantic",
]
litestar = [
    "litestar",
    "peregrine-server[uvloop]",
    "uvloop>=0.23.0",
    "ryjwt>=0.3.1",
    "lothc[msgspec]>=0.3.0",
    "fastpg>=0.2.2",
]
flask = [
    "flask",
    "peregrine-server",
    "ryjwt>=0.3.1",
    "lothc[pydantic]>=0.3.0",
    "psycopg[binary,pool]",
    "pydantic",
]
blacksheep = [
    "blacksheep",
    "peregrine-server[uvloop]",
    "uvloop>=0.23.0",
    "ryjwt>=0.3.1",
    "lothc[pydantic]>=0.3.0",
    "fastpg[pydantic]>=0.2.2",
    "pydantic",
]
robyn = ["robyn", "ryjwt>=0.3.1", "lothc[pydantic]>=0.3.0", "fastpg[pydantic]>=0.2.2", "pydantic"]
django-bolt = [
    "django>=5.2",
    "django-bolt",
    "msgspec",
    "ryjwt>=0.3.1",
    "lothc>=0.3.0",
    "fastpg>=0.2.2",
]
