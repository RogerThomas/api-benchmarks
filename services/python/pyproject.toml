[project]
name = "jero-benchmarks-python"
version = "0.0.0"
description = "Python API-framework benchmark targets. One uv dependency group per framework."
requires-python = ">=3.14.3"
dependencies = []

[tool.uv]
# Not a package — just a home for per-framework dependency groups installed into
# isolated venvs (one per Dockerfile stage).
package = false

[tool.uv.sources]
# fastpg isn't on PyPI: a linux/arm64 cp314 wheel built from its repo with maturin.
fastpg = { path = "vendor/fastpg-0.1.0-cp314-cp314-manylinux_2_17_aarch64.manylinux2014_aarch64.whl" }
# robyn publishes no cp314 wheels (and no sdist), so build its release tag from source.
robyn = { url = "https://github.com/sparckles/Robyn/archive/refs/tags/v0.88.0.tar.gz" }

# One group per framework. Each Dockerfile stage syncs ONLY its own group
# (`uv sync --no-default-groups --group <fw>`) so deps never interfere.
[dependency-groups]
jero = [
    "peregrine-server[uvloop]",
    "ryjwt[msgspec]",
    "lothc[msgspec]",
    "fastpg",
    "pydantic-settings",
    "jero>=0.0.27",
]
fastapi = [
    "fastapi",
    "peregrine-server[uvloop]",
    "ryjwt",
    "lothc[pydantic]",
    "fastpg[pydantic]",
    "pydantic-settings",
]
litestar = [
    "litestar",
    "peregrine-server[uvloop]",
    "ryjwt",
    "lothc[msgspec]",
    "fastpg",
    "pydantic-settings",
]
flask = [
    "flask",
    "peregrine-server",
    "ryjwt",
    "lothc[pydantic]",
    "psycopg[binary,pool]",
    "pydantic-settings",
]
blacksheep = [
    "blacksheep",
    "peregrine-server[uvloop]",
    "ryjwt",
    "lothc[pydantic]",
    "fastpg[pydantic]",
    "pydantic-settings",
]
robyn = [
    "robyn",
    "ryjwt",
    "lothc[pydantic]",
    "fastpg[pydantic]",
    "pydantic-settings",
]
django-bolt = [
    "django>=5.2",
    "django-bolt",
    "msgspec",
    "ryjwt",
    "lothc",
    "fastpg",
    "pydantic-settings",
]
